[project]
name = "network-traffic-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ryanjek", email = "ryanngjekhian@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "captum>=0.9.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "optuna-integration>=5.0.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "torch>=2.14.1",
    "torch-geometric>=2.8.0.post1",
    "treeig>=0.2.2 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false

[project.scripts]
network-traffic-classification = "network_traffic_classification:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pygments>=2.21.0",
]
